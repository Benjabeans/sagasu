[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sagasu"
version = "0.1.0"
description = "Host and in-container control for Sagasu browser sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Sagasu contributors" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
sagasu = "sagasu.cli.main:main"
sagasu-session-exec = "sagasu.cli.session_executor:main"
sagasu-xcontrol = "sagasu.cli.session_executor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: requires a built and running Sagasu browser container",
]
